<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <rect width="800" height="450" fill="#16181a"/>
  <!-- terminal chrome -->
  <rect x="0" y="0" width="800" height="30" fill="#232520"/>
  <circle cx="20" cy="15" r="5" fill="#e0705a"/>
  <circle cx="38" cy="15" r="5" fill="#e0b25a"/>
  <circle cx="56" cy="15" r="5" fill="#5ac26a"/>
